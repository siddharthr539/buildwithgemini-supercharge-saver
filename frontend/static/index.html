<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperchargeSaver</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<!-- Marked.js for rich markdown, bolding, lists and table rendering in messages -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --accent: #e82127;
    --accent-glow: rgba(232, 33, 39, 0.35);
    --bg-primary: #0a0c10;
    --bg-secondary: #12151c;
    --card-bg: rgba(22, 27, 36, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-primary: #f3f5f8;
    --text-secondary: #9aa1b2;
    --green: #10b981;
    --gold: #f59e0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1e28 0%, var(--bg-primary) 70%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
  }
  
  /* Modern Glass Header */
  header {
    background: rgba(14, 17, 23, 0.82);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--card-border);
    padding: .85rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  .header-brand { display: flex; align-items: center; gap: .6rem; }
  .brand-logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #e82127 0%, #8b0000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    box-shadow: 0 0 14px var(--accent-glow);
  }
  .brand-text h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.3px; color: #fff; }
  .brand-text p { margin: 0; font-size: 0.72rem; color: var(--text-secondary); }

  /* Tesla Telemetry HUD Bar (Horizontal scroll on mobile) */
  .hud-bar {
    background: rgba(10, 12, 16, 0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--card-border);
    padding: .5rem 1rem;
    display: flex;
    gap: .6rem;
    align-items: center;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    z-index: 10;
  }
  .hud-bar::-webkit-scrollbar { display: none; }
  .hud-pill {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: .35rem .75rem;
    border-radius: 9999px;
    font-size: .78rem;
    color: var(--text-secondary);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    flex-shrink: 0;
  }
  .hud-pill strong { color: var(--text-primary); }
  .hud-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .hud-pill .dot.yellow { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .hud-pill.clickable { cursor: pointer; }
  .hud-pill.clickable:active { transform: scale(0.96); }
  .hud-pill.clickable:hover { border-color: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }
  .hud-pill.locked-badge { border-color: rgba(245, 158, 11, 0.3); background: rgba(245, 158, 11, 0.08); color: #fde68a; }

  /* Chat Message Area */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    scroll-behavior: smooth;
  }
  .msg { display: flex; width: 100%; margin: 0; }
  .msg.user { justify-content: flex-end; }
  .msg.agent { justify-content: flex-start; }
  
  .bubble {
    display: inline-block;
    padding: .85rem 1.15rem;
    border-radius: 18px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    color: var(--text-primary);
    max-width: 88%;
    line-height: 1.55;
    font-size: 0.94rem;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
    word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent) 0%, #b81419 100%);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .msg.agent .bubble { border-bottom-left-radius: 4px; }
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; box-shadow: none; }

  /* Markdown Inside Messages */
  .bubble.markdown-content p { margin: 0 0 .55rem 0; }
  .bubble.markdown-content p:last-child { margin-bottom: 0; }
  .bubble.markdown-content h1, .bubble.markdown-content h2, .bubble.markdown-content h3 {
    color: #fff;
    margin: .8rem 0 .4rem 0;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .bubble.markdown-content ul, .bubble.markdown-content ol { margin: .3rem 0 .6rem 1.25rem; padding: 0; }
  .bubble.markdown-content li { margin-bottom: .3rem; }
  .bubble.markdown-content strong { color: #fff; }
  .bubble.markdown-content hr { border: none; border-top: 1px solid var(--card-border); margin: .75rem 0; }
  
  /* Tables */
  .bubble.markdown-content table {
    border-collapse: collapse;
    width: 100%;
    margin: .6rem 0;
    font-size: .84rem;
    border-radius: 8px;
    overflow: hidden;
  }
  .bubble.markdown-content th, .bubble.markdown-content td {
    border: 1px solid var(--card-border);
    padding: .5rem .7rem;
    text-align: left;
  }
  .bubble.markdown-content th { background: rgba(255, 255, 255, 0.06); color: #fff; }

  /* Animated Loader */
  .typing-loader { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.88rem; }
  .pulse-bolt { animation: pulse 0.8s infinite alternate; font-size: 1.25rem; color: var(--accent); }
  @keyframes pulse { from { opacity: 0.35; transform: scale(0.9); } to { opacity: 1; transform: scale(1.2); } }

  /* Mobile-first Floating Bottom Composer */
  .composer {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: .5rem 1rem env(safe-area-inset-bottom, 1rem);
    background: transparent;
    z-index: 20;
  }
  .suggestions {
    display: flex;
    gap: .5rem;
    padding-bottom: .6rem;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .suggestions::-webkit-scrollbar { display: none; }
  .suggestion-btn {
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    color: var(--text-secondary);
    border-radius: 9999px;
    padding: .45rem .95rem;
    font-size: .8rem;
    cursor: pointer;
    transition: all .2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    flex-shrink: 0;
  }
  .suggestion-btn:hover, .suggestion-btn:active {
    border-color: var(--accent);
    background: rgba(232, 33, 39, 0.15);
    color: #fff;
    transform: translateY(-1px);
  }
  
  .input-bar {
    display: flex;
    gap: .5rem;
    background: rgba(22, 27, 36, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: .4rem .4rem .4rem 1rem;
    border: 1px solid var(--card-border);
    border-radius: 28px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    align-items: center;
  }
  .input-bar:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    color: #fff;
    font-size: .95rem;
    outline: none;
    padding: .5rem 0;
    min-width: 0;
  }
  input::placeholder { color: #647087; }
  
  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .2s ease;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #ff2a30; box-shadow: 0 0 12px var(--accent-glow); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 1.2rem;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--text-primary);
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: .75rem; }
  .a2col { display: flex; flex-direction: column; gap: .45rem; }
  .a2row { display: flex; flex-direction: row; gap: .6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.45; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #fff; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #fff; }
  .a2text.a2-h4 { font-size: .95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: .82rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--card-border); margin: .5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* Vehicle Selector & Location Inputs in HUD */
  .vehicle-select {
    background: transparent;
    border: none;
    color: #fff;
    font-size: .78rem;
    font-weight: 600;
    outline: none;
    cursor: pointer;
  }
  .vehicle-select option {
    background: #1a1e28;
    color: #fff;
  }
  .location-input-pill {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    background: var(--card-bg);
    border: 1px solid var(--accent);
    padding: .25rem .65rem;
    border-radius: 9999px;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .location-input-pill input {
    background: transparent;
    border: none;
    color: #fff;
    font-size: .78rem;
    outline: none;
    width: 140px;
    padding: 0;
  }
  .location-input-pill input::placeholder {
    color: #ff8589;
  }

  @media (max-width: 600px) {
    header { padding: .7rem 1rem; }
    #log { padding: .75rem; }
    .bubble { max-width: 94%; font-size: 0.9rem; padding: .75rem 1rem; }
    .composer { padding: .4rem .75rem calc(env(safe-area-inset-bottom, 0.75rem) + 0.4rem); }
    .location-input-pill input { width: 110px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <div class="brand-logo">⚡</div>
    <div class="brand-text">
      <h1>SuperchargeSaver</h1>
      <p>Tesla Smart Charging Optimizer</p>
    </div>
  </div>
  <div class="hud-pill" style="padding:.25rem .6rem; font-size:.72rem;">
    <span class="dot"></span> Online
  </div>
</header>

<div class="hud-bar">
  <!-- Interactive Tesla Model Selector -->
  <div class="hud-pill" title="Select your Tesla model">
    <span>🚗</span>
    <select id="vehicle-select" class="vehicle-select">
      <option value="Model 3 Standard Range" data-kwh="54">Model 3 Standard (54 kWh)</option>
      <option value="Model 3 Long Range" data-kwh="78">Model 3 Long Range (78 kWh)</option>
      <option value="Model 3 Performance" data-kwh="78">Model 3 Performance (78 kWh)</option>
      <option value="Model Y Long Range" data-kwh="75" selected>Model Y Long Range (75 kWh)</option>
      <option value="Model Y Performance" data-kwh="75">Model Y Performance (75 kWh)</option>
      <option value="Model S Dual Motor" data-kwh="100">Model S Long Range (100 kWh)</option>
      <option value="Model S Plaid" data-kwh="100">Model S Plaid (100 kWh)</option>
      <option value="Model X Dual Motor" data-kwh="100">Model X Long Range (100 kWh)</option>
      <option value="Model X Plaid" data-kwh="100">Model X Plaid (100 kWh)</option>
      <option value="Cybertruck All-Wheel Drive" data-kwh="123">Cybertruck AWD (123 kWh)</option>
      <option value="Cybertruck Cyberbeast" data-kwh="123">Cyberbeast (123 kWh)</option>
    </select>
  </div>

  <!-- Auto Populated Battery Capacity Badge -->
  <div class="hud-pill" title="Battery capacity auto-calculated from model">
    <span>⚡ Capacity: <strong id="hud-capacity-val">75 kWh</strong></span>
  </div>

  <!-- Mandatory Location / Zipcode Pill -->
  <div class="location-input-pill" title="Always specify your location or zipcode">
    <span>📍</span>
    <input id="loc-input" placeholder="Zipcode or address..." value="Austin, TX">
  </div>

  <div class="hud-pill clickable" id="hud-soc" title="Tap to simulate battery change">
    <span>🔋 <strong id="hud-soc-val">22% SoC</strong></span>
  </div>

  <div class="hud-pill locked-badge" title="5-Star Google ratings only">
    <span>⭐ <strong>5-Star Google Spots</strong></span>
  </div>
</div>

<div id="log"></div>

<div class="composer">
  <div class="suggestions">
    <button type="button" class="suggestion-btn" data-prompt="Find the cheapest Supercharger near me right now with 5-star Google amenities">⚡ Cheapest station nearby</button>
    <button type="button" class="suggestion-btn" data-prompt="How much does it cost to charge from 20% to 80%?">🔋 20% to 80% cost</button>
    <button type="button" class="suggestion-btn" data-prompt="What are the current off-peak pricing hours and rates?">🕒 Off-peak hours</button>
  </div>
  <form id="form">
    <div class="input-bar">
      <input id="input" placeholder="Ask about rates, charging time, or stations..." autocomplete="off" autofocus>
      <button class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    b.classList.add("markdown-content");
    // Render through marked parser if available, falling back to text
    if (typeof marked !== "undefined" && marked.parse) {
      b.innerHTML = marked.parse(textStr);
    } else {
      b.appendChild(el("div", null, textStr));
    }
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// Dynamic Model & Auto Battery Capacity Calculation
const vehicleSelect = document.getElementById("vehicle-select");
const hudCapacityVal = document.getElementById("hud-capacity-val");
const locInput = document.getElementById("loc-input");

if (vehicleSelect && hudCapacityVal) {
  vehicleSelect.addEventListener("change", () => {
    const opt = vehicleSelect.options[vehicleSelect.selectedIndex];
    const kwh = opt.getAttribute("data-kwh");
    hudCapacityVal.textContent = kwh + " kWh";
  });
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  const selectedModel = vehicleSelect ? vehicleSelect.value : "Model Y Long Range";
  const selectedKwh = vehicleSelect ? vehicleSelect.options[vehicleSelect.selectedIndex].getAttribute("data-kwh") : "75";
  let location = locInput ? locInput.value.trim() : "";
  if (!location) {
    location = prompt("Please provide your zipcode or address to find nearby Superchargers:", "Austin, TX") || "Austin, TX";
    if (locInput) locInput.value = location;
  }

  // Display user text in chat bubble
  bubble("user").textContent = text;
  input.value = "";
  
  // Custom Tesla-themed pulsing loading indicator
  const b = bubble("agent");
  b.innerHTML = '<span class="typing-loader"><span class="pulse-bolt">⚡</span> <span>Checking Superchargers & 5-star amenities near ' + location + '…</span></span>';
  
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        vehicle_model: selectedModel,
        battery_capacity_kwh: selectedKwh,
        location: location
      })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

// Attach click listener to prompt suggestion buttons
document.querySelectorAll(".suggestion-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const prompt = btn.getAttribute("data-prompt");
    if (prompt) {
      input.value = prompt;
      form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
});

// Interactive HUD Battery SoC clicker
let currentSimSoC = 22;
const hudSoc = document.getElementById("hud-soc");
const hudSocVal = document.getElementById("hud-soc-val");
if (hudSoc && hudSocVal) {
  hudSoc.addEventListener("click", () => {
    currentSimSoC = (currentSimSoC + 15) % 90;
    if (currentSimSoC < 15) currentSimSoC = 15;
    hudSocVal.textContent = currentSimSoC + "% SoC";
    input.value = `My battery is currently at ${currentSimSoC}%. Estimate charging cost to 80% at the nearest Supercharger.`;
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  });
}
</script>
